name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
          python-version: "3.13"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Tag and package version differ"
          PY
      - name: Install locked test dependencies
        run: uv sync --frozen --group docs
      - name: Validate source and documentation
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy src tools
          uv run --no-sync pytest -q
          uv run --no-sync python -m tools.probity_audit
          uv run --no-sync sphinx-build -W --keep-going -b html docs site
          git diff --check
      - name: Build distributions
        run: uv build --no-sources --out-dir dist/release
      - name: Qualify installed wheel
        run: uv run --no-sync python -m tools.qualify_distribution --artifacts dist/release --output dist/qualification
      - name: Export dependency inventory
        run: uv export --format cyclonedx1.5 --frozen --all-groups --all-extras --output-file dist/qualification/sbom.cdx.json > /dev/null
      - name: Retain qualification results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pyspd-qualification
          path: dist/qualification/
          if-no-files-found: error
      - name: Transfer qualified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pyspd-distributions
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pyspd/
    permissions:
      id-token: write
    steps:
      - name: Download qualified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pyspd-distributions
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --publish-url https://upload.pypi.org/legacy/ --check-url https://pypi.org/simple/ dist/pyspd-*.whl dist/pyspd-*.tar.gz
