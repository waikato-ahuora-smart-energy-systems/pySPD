name: Publish to PyPI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reject-invalid-dispatch:
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a release tag for manual publication
        run: |
          echo "Run publication at a vMAJOR.MINOR.PATCH tag. Main pushes create tags automatically." >&2
          exit 1

  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the merged release candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create the matching version tag and dispatch publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:pyproject.toml" > "${RUNNER_TEMP}/base-pyproject.toml"
          version="$(python3 -m tools.release_version check \
            --base-pyproject "${RUNNER_TEMP}/base-pyproject.toml")"
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "${GITHUB_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "pySPD ${version}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi
          # Tag pushes by GITHUB_TOKEN do not start push workflows. An explicit
          # dispatch runs the qualification and PyPI OIDC jobs at the tag ref.
          gh workflow run publish-pypi.yml --ref "${tag}"

  qualify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
          python-version: "3.13"
      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python -m tools.release_version check --tag "${RELEASE_TAG}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Install locked test dependencies
        run: uv sync --frozen --group docs
      - name: Validate source and documentation
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy src tools
          uv run --no-sync pytest -q
          uv run --no-sync python -m tools.probity_audit
          uv run --no-sync sphinx-build -W --keep-going -b html docs site
          git diff --check
      - name: Build distributions
        run: uv build --no-sources --out-dir dist/release
      - name: Qualify installed wheel
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: uv run --no-sync python -m tools.qualify_distribution --artifacts dist/release --output dist/qualification --expected-version "${RELEASE_VERSION}"
      - name: Export dependency inventory
        run: uv export --format cyclonedx1.5 --frozen --all-groups --all-extras --output-file dist/qualification/sbom.cdx.json > /dev/null
      - name: Retain qualification results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pyspd-qualification
          path: dist/qualification/
          if-no-files-found: error
      - name: Transfer qualified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pyspd-distributions
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pyspd/
    permissions:
      id-token: write
    steps:
      - name: Download qualified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pyspd-distributions
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
      - name: Publish to PyPI
        env:
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
        run: uv publish --trusted-publishing always --publish-url https://upload.pypi.org/legacy/ --check-url https://pypi.org/simple/ "dist/pyspd-${RELEASE_VERSION}-py3-none-any.whl" "dist/pyspd-${RELEASE_VERSION}.tar.gz"

  github-release:
    needs: [qualify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pyspd-distributions
          path: dist
      - name: Create the GitHub release from the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release download "${RELEASE_TAG}" --dir existing
            diff -r dist existing
          else
            gh release create "${RELEASE_TAG}" --verify-tag --generate-notes \
              --title "pySPD ${RELEASE_TAG}" dist/*.whl dist/*.tar.gz
          fi
