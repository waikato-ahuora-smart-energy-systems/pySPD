name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - name: Synchronize locked dependencies
        run: uv sync --frozen --group clp --group cbc --group docs
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src tools
      - name: Test
        run: uv run --group clp --group cbc pytest -q
      - name: Audit probity evidence
        run: uv run python -m tools.probity_audit
      - name: Build documentation
        run: uv run mkdocs build --strict
