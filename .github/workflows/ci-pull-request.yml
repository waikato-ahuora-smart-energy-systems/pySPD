name: PR Validation

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.29"

jobs:
  quality:
    name: Python 3.13 / macOS
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Synchronize locked dependencies
        run: uv sync --frozen --group clp --group cbc --group docs
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy src tools
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Audit probity evidence
        run: uv run --no-sync python -m tools.probity_audit
      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
