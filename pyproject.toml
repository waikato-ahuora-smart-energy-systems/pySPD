[project]
name = "pyspd"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyarrow>=18,<23",
    "pyomo>=6.9,<7",
]

[project.scripts]
pyspd = "pyspd.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
default-groups = ["dev", "highs"]

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "jsonschema>=4,<5",
  "mypy>=1,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-timeout>=2,<3",
  "ruff>=0.12,<1",
]
highs = [
    "highspy>=1.11,<2",
]
oracle = [
    "gamspy>=1.27.0",
]
gdx = [
    "gamspy>=1.27.0",
]
cplex = []
gurobi = [
    "gurobipy>=12,<13",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9,<10",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
markers = [
  "oracle: requires an external vSPD checkout and licensed GAMS runtime",
]
