[project]
name = "pySPD"
version = "0.1.1"
description = "Class-based Pyomo implementation of vSPD under staged validation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "highspy>=1.11,<2",
    "pyarrow>=18,<23",
    "pyomo>=6.9,<7",
    "pyscipopt>=5.5,<6",
]

[project.optional-dependencies]
gdx = ["gamspy>=1.27.0"]
clp = ["cylp>=0.94,<1"]
cbc = ["pulp>=3.2,<4"]
probity = ["jsonschema>=4,<5"]

[project.urls]
Repository = "https://github.com/waikato-ahuora-smart-energy-systems/pySPD"
Issues = "https://github.com/waikato-ahuora-smart-energy-systems/pySPD/issues"

[project.scripts]
pyspd = "pyspd.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyspd"]

[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "pyspd/_build/uv.lock"

[tool.hatch.build.targets.sdist]
include = ["/src/pyspd", "/pyproject.toml", "/uv.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.uv]
package = true
default-groups = ["dev", "highs", "clp", "cbc"]

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "jsonschema>=4,<5",
  "mypy>=1,<2",
  "pandas>=3,<4",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-timeout>=2,<3",
  "ruff>=0.12,<1",
]
highs = [
    "highspy>=1.11,<2",
]
oracle = [
    "gamspy>=1.27.0",
    "gamspy-highs==54.3.1",
    "gamspy-ipopt==54.3.1",
    "gamspy-miles==54.3.1",
    "gamspy-reshop==54.3.1",
    "gamspy-scip==54.3.1",
    "gamspy-shot==54.3.1",
]
gdx = [
    "gamspy>=1.27.0",
]
cplex = []
gurobi = [
    "gurobipy>=12,<13",
]
docs = [
    "sphinx>=9.1,<10",
    "sphinx-rtd-theme>=3.1,<4",
    "myst-parser>=5,<6",
]
clp = [
    "cylp>=0.94,<1",
]
cbc = [
    "pulp>=3.2,<4",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
markers = [
  "oracle: requires an external vSPD checkout and licensed GAMS runtime",
]
